name: Prisma foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: prisma-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate foundation
        run: pnpm validate

      - name: Validate Supabase ledger registry
        run: pnpm check:supabase-ledger

      - name: Validate selective VPS deploy script
        run: bash -n deploy/release-web.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
