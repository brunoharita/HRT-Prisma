name: Prisma foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: prisma-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Enable only after the KVM2 readiness/approval checkpoints in the runbook.
    runs-on: ${{ fromJSON(vars.PRISMA_KVM2_CI_ENABLED == 'true' && github.repository == 'brunoharita/HRT-Prisma' && github.event_name == 'push' && github.ref == 'refs/heads/main' && '["self-hosted","linux","x64","prisma-kvm2-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate KVM2 CI routing policy
        run: node --test tests/tooling/kvm2Ci.test.mjs

      - name: Validate foundation
        run: pnpm validate

      - name: Validate Supabase ledger registry
        run: pnpm check:supabase-ledger

      - name: Validate selective VPS deploy script
        run: bash -n deploy/release-web.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
