server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF.js ships its module worker as .mjs; Nginx 1.27 defaults that suffix to octet-stream.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # Preserve the existing Paddle URLs. The gateway authenticates before forwarding.
    location ~ ^/document-intelligence(-vl)?/layout-parsing$ {
        client_max_body_size 21m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://unix:/run/paddle-gateway/gateway.sock;
        access_log off;
    }

    location ~ ^/document-intelligence(-vl)?(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
