services:
  profile-synthesis:
    image: prisma-profile-synthesis:${PRISMA_SYNTHESIS_SHA:?validated SHA required}
    build:
      context: ..
      dockerfile: services/profile-synthesis/Dockerfile
    container_name: prisma-profile-synthesis
    restart: unless-stopped
    environment:
      SYNTHESIS_CONFIG_FILE: /run/secrets/profile-synthesis.env
      OPENAI_ENV_FILE: /run/secrets/openai.env
      OCCUPATIONAL_RAG_ENABLED: "true"
      OCCUPATIONAL_RAG_URL: http://knowledge-model:11434
      OCCUPATIONAL_RAG_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OCCUPATIONAL_RAG_MODEL_DIGEST: 0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
      OCCUPATIONAL_RAG_EMBEDDING_DIGEST: 7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab
    volumes:
      - /etc/prisma/profile-synthesis.env:/run/secrets/profile-synthesis.env:ro
      - /etc/prisma/parser-ia.env:/run/secrets/openai.env:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
  knowledge-model:
    image: ollama/ollama:0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    container_name: prisma-knowledge-model
    user: "1000:1000"
    restart: unless-stopped
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - /var/lib/prisma/knowledge-models:/models:ro
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 1.25
    cpu_shares: 128
    pids_limit: 192
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
