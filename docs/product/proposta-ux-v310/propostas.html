<script>
(()=>{
  const root=document.getElementById('prisma-ux-proposals');
  const main=root.querySelector('.pux-main'),frame=root.querySelector('.pux-frame'),dialog=root.querySelector('.pux-dialog'),dialogBody=root.querySelector('.pux-dialog-content'),dialogActions=root.querySelector('.pux-dialog-actions'),live=root.querySelector('.pux-live');
  const state={step:'1',view:'desktop',homeRole:'Recruiter',people:['Marina Costa','Rafael Lima']};
  const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:20,height:20}});};
  const announce=text=>{live.textContent=text;};
  const paragraph=text=>{const p=document.createElement('p');p.textContent=text;return p;};
  function block(title,text){const el=document.createElement('section');el.className='pux-dialog-block';const h=document.createElement('h3');h.textContent=title;el.append(h,paragraph(text));return el;}
  function button(label,handler,primary=false){const b=document.createElement('button');b.type='button';b.className='pux-button'+(primary?' pux-primary':'');b.textContent=label;b.addEventListener('click',handler);return b;}
  function showDialog(title,content,actions=[]){root.querySelector('#pux-dialog-title').textContent=title;dialogBody.replaceChildren(...content);dialogActions.replaceChildren(...actions,button('Fechar',()=>dialog.close()));if(!dialog.open)dialog.showModal();icons();}
  function applyView(){frame.classList.toggle('is-mobile',state.view==='mobile');root.querySelector('.pux-view').value=state.view;}
  function render(){
    if(dialog.open)dialog.close();main.replaceChildren(root.querySelector('template[data-screen="'+state.step+'"]').content.cloneNode(true));
    root.querySelectorAll('.pux-proposals [data-step]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.step===state.step)));
    root.querySelectorAll('.pux-sidebar [data-nav]').forEach(b=>b.classList.toggle('is-active',b.dataset.nav===(state.step==='2'?'home':state.step==='5'?'tokens':state.step==='4'?'positions':'people')));
    root.querySelector('.pux-role-label').textContent=state.step==='2'?state.homeRole:'Recruiter';
    root.querySelectorAll('.pux-sidebar .pux-menu-item,.pux-sidebar .pux-menu-group,.pux-sidebar>button').forEach(el=>el.hidden=false);
    if(state.step==='2'&&state.homeRole==='Usuário comum')root.querySelectorAll('.pux-sidebar .pux-menu-item,.pux-sidebar .pux-menu-group').forEach(el=>{el.hidden=!['Operação','Posições','Administração'].includes(el.textContent.trim());});
    if(state.step==='2'&&state.homeRole!=='Recruiter')renderHomeRole();
    if(state.step==='4')hydrateComparison();
    applyView();icons();announce('');
  }
  function renderHomeRole(){
    const variants={
      'Owner':{title:'Seu grupo, em perspectiva',description:'Acompanhe as empresas do seu grupo e suas pendências.',hero:'Grupo Horizonte',detail:'2 empresas ativas · saldos e dados mantidos por empresa',tasks:[['Empresas do grupo','Consulte a situação e os acessos de cada empresa.'],['Acessos para conferir','Acompanhe os vínculos das equipes autorizadas.'],['Consumo por empresa','Consulte saldos sem compartilhamento entre empresas.']]},
      'Super Admin':{title:'Visão da plataforma',description:'Acompanhe grupos, implantação e exceções administrativas.',hero:'Implantação de novos grupos',detail:'1 grupo em preparação · aguardando cadastro de Owner',tasks:[['1 grupo para concluir implantação','O Owner ativo libera o grupo e sua primeira empresa.'],['Responsáveis e acessos','Consulte a gestão de Owner dos grupos.'],['Situação das empresas','Acompanhe exceções administrativas.']]},
      'Usuário comum':{title:'Seu espaço no Prisma',description:'Consulte os conteúdos autorizados para a sua empresa.',hero:'Continue sua consulta',detail:'Perfil profissional consultado recentemente',tasks:[['Consultar Pessoas','Acesse somente as informações permitidas.'],['Posições disponíveis para consulta','Consulte os conteúdos autorizados.'],['Seus acessos','A empresa padrão continua definida pelo sistema.']]}
    };const v=variants[state.homeRole];if(!v)return;
    main.querySelector('h1').textContent=v.title;main.querySelector('.pux-home-description').textContent=v.description;main.querySelector('.pux-highlight-panel h2').textContent=v.hero;main.querySelector('.pux-highlight-panel p').textContent=v.detail;
    const hero=main.querySelector('.pux-highlight-panel .pux-button');hero.textContent=state.homeRole==='Usuário comum'?'Abrir Perfil':state.homeRole==='Owner'?'Consultar empresas':'Consultar grupos';hero.dataset.action='role-context';delete hero.dataset.step;
    main.querySelector('.pux-section-heading h2').textContent=state.homeRole==='Usuário comum'?'Acessos disponíveis':'Precisa da sua atenção';main.querySelector('.pux-section-heading .pux-badge').hidden=true;
    main.querySelectorAll('.pux-task').forEach((b,i)=>{delete b.dataset.step;b.dataset.action='role-context';b.querySelector('strong').textContent=v.tasks[i][0];b.querySelector('small').textContent=v.tasks[i][1];});
    if(state.homeRole==='Usuário comum'){main.querySelector('.pux-heading>.pux-button').hidden=true;main.querySelector('.pux-home-summary').hidden=true;main.querySelectorAll('.pux-recent')[1].hidden=true;}
  }
  const peopleData={
    'Marina Costa':{initials:'MC',role:'Gerente de Operações',company:'Empresa Aurora',file:'curriculo_marina.pdf',score:78,coverage:3,requirements:[['ok','Coordenação de equipe na Empresa Aurora.'],['ok','Projetos de revisão de rotinas documentados.'],['ok','Acompanhamento de indicadores descrito na experiência.'],['none','Não há informação publicada suficiente.']]},
    'Rafael Lima':{initials:'RL',role:'Coordenador de Operações',company:'Empresa Atlântica',file:'curriculo_rafael.pdf',score:74,coverage:2,requirements:[['ok','Liderança operacional na Empresa Atlântica.'],['partial','Participação citada, sem detalhamento da contribuição.'],['partial','Indicadores citados, sem detalhamento da rotina.'],['ok','Planejamento de despesas operacionais documentado.']]},
    'Joana Alves':{initials:'JA',role:'Analista de Processos',company:'Empresa Vale',file:'curriculo_joana.pdf',score:71,coverage:2,requirements:[['partial','Coordenação de atividades citada; gestão de equipe a confirmar.'],['ok','Projetos de melhoria descritos na experiência.'],['ok','Análise de indicadores documentada.'],['none','Não há informação publicada suficiente.']]}
  };
  function hydrateComparison(){
    const names=state.people,cards=main.querySelectorAll('.pux-comparison-people>.pux-panel');
    names.forEach((name,i)=>{const p=peopleData[name],card=cards[i];card.querySelector('.pux-avatar').textContent=p.initials;const link=card.querySelector('.pux-person-link button');link.textContent=name;delete link.dataset.step;link.dataset.action=name==='Marina Costa'?'marina-profile':name==='Rafael Lima'?'rafael-profile':'joana-profile';card.querySelector('.pux-person-link small').textContent=p.role;const values=card.querySelectorAll('.pux-score-line strong');values[0].firstChild.textContent=p.score;values[1].firstChild.textContent=p.coverage;main.querySelectorAll('.pux-comparison-table thead th')[i+1].textContent=name;});
    main.querySelectorAll('.pux-comparison-table tbody tr').forEach((row,n)=>{row.dataset.equal=String(peopleData[names[0]].requirements[n][0]===peopleData[names[1]].requirements[n][0]);row.querySelectorAll('td').forEach((cell,i)=>{const r=peopleData[names[i]].requirements[n];cell.dataset.label=names[i];const tag=cell.querySelector('.pux-state');tag.className='pux-state'+(r[0]==='ok'?' pux-state-ok':r[0]==='partial'?' pux-state-warn':'');tag.textContent=r[0]==='ok'?'✓ Evidência publicada':r[0]==='partial'?'◐ Evidência parcial':'— Sem evidência suficiente';cell.querySelector('p').textContent=r[1];});});
  }
  function selected(){const n=main.querySelectorAll('.pux-people-table input:checked').length;const s=main.querySelector('.pux-selection');if(s){s.hidden=n===0;s.querySelector('.pux-selection-count').textContent=n;s.querySelector('[data-action="compare-selection"]').disabled=n!==2;}}
  function simulate(){const activity=main.querySelector('.pux-simulator select'),quantity=main.querySelector('.pux-simulator input');if(!activity||!quantity)return;const count=Math.max(1,Math.floor(Number(quantity.value)||1)),rate=Number(activity.value),cost=count*rate;main.querySelector('.pux-estimate').textContent=cost.toLocaleString('pt-BR')+' Tokens Prisma';main.querySelector('.pux-after').textContent=cost>865000?'Saldo insuficiente':(865000-cost).toLocaleString('pt-BR')+' Tokens Prisma';main.querySelector('.pux-rate-label').textContent='Tarifa ilustrativa: '+rate.toLocaleString('pt-BR')+' Tokens Prisma por atividade.';}
  function personTab(label){if(label==='Resumo')return;const texts={'Competências':'Declarações publicadas: gestão de processos, indicadores e liderança de equipes. Há 3 associações pendentes; elas não invalidam o Perfil publicado.','Evidências':'As informações podem ser consultadas nas experiências e nos documentos que sustentam o Perfil.','Perfil completo':'Formação, experiências, idiomas e demais registros permanecem integrais no Perfil completo.','Documentos e revisões':'curriculo_marina.pdf · Perfil publicado na versão 3. Uma nova importação gera revisão antes de substituir o vigente.','Histórico':'14/10/2026 · Perfil versão 3 publicado. 12/10/2026 · Revisão salva. As versões anteriores permanecem preservadas.'};showDialog(label+' · Marina Costa',[paragraph(texts[label]||'Conteúdo ilustrativo da seção selecionada.')]);}
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el.matches('.pux-view')){state.view=el.value;applyView();return;}
    if(el.matches('.pux-people-table input[type=checkbox]')){if(main.querySelectorAll('.pux-people-table input:checked').length>2){el.checked=false;announce('Selecione até duas pessoas para comparar.');}selected();}
    if(el.matches('.pux-differences'))main.querySelectorAll('[data-equal=true]').forEach(row=>row.hidden=el.checked);
    if(el.closest('.pux-simulator'))simulate();
    if(el.matches('.pux-person-mobile-nav select'))personTab(el.value);
  });
  root.addEventListener('input',event=>{const el=event.target;if(el.matches('input[aria-label="Buscar pessoas"]')){let count=0;main.querySelectorAll('[data-person]').forEach(row=>{row.hidden=!row.textContent.toLocaleLowerCase('pt-BR').includes(el.value.toLocaleLowerCase('pt-BR'));if(!row.hidden)count++;});main.querySelector('.pux-people-count').textContent=count;main.querySelector('.pux-empty-search').hidden=count!==0;}if(el.closest('.pux-simulator'))simulate();});
  root.addEventListener('click',event=>{
    const el=event.target.closest('button');if(!el||!root.contains(el))return;
    if(el.dataset.step){state.step=el.dataset.step;render();return;}
    if(el.dataset.personTab){personTab(el.dataset.personTab);return;}
    if(el.dataset.mode){const mode=el.dataset.mode;main.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('is-active',b===el));main.querySelector('.pux-query-extra').hidden=mode!=='find';main.querySelector('.pux-position-choice').hidden=mode!=='position';main.querySelector('.pux-base-filters').hidden=mode==='position';if(mode==='find')main.querySelector('input[type=search]').placeholder='Busque por experiência, conhecimento ou formação';else main.querySelector('input[type=search]').placeholder='Buscar por nome, empresa, área ou cargo';return;}
    if(el.dataset.importTab){const files=el.dataset.importTab==='files';main.querySelector('.pux-import-files').hidden=!files;main.querySelector('.pux-import-connections').hidden=files;main.querySelectorAll('[data-import-tab]').forEach(b=>b.classList.toggle('is-active',b===el));return;}
    const action=el.dataset.action;
    if(action==='close-dialog'){dialog.close();return;}
    if(action==='filters'){const extras=main.querySelector('.pux-query-extra');extras.hidden=!extras.hidden;return;}
    if(action==='remove-area'){el.parentElement.hidden=true;main.querySelector('select[aria-label="Área profissional"]').selectedIndex=1;return;}
    if(action==='reset-filters'){state.step='1';render();main.querySelector('select[aria-label="Área profissional"]').selectedIndex=1;main.querySelector('.pux-filter-chips>span').hidden=true;announce('Filtros restaurados: Pessoas ativas, sem restrição de área.');return;}
    if(action==='clear-selection'){main.querySelectorAll('.pux-people-table input').forEach(i=>i.checked=false);selected();return;}
    if(action==='compare-selection'){const names=[...main.querySelectorAll('.pux-people-table input:checked')].map(i=>i.closest('tr').dataset.person);state.people=names;state.step='4';render();announce('Comparação ilustrativa de '+names.join(' e ')+'.');return;}
    if(action==='save-search'){const label=document.createElement('label');label.textContent='Nome da busca';const input=document.createElement('input');input.value='Operações · Pessoas ativas';label.append(input);showDialog('Salvar busca',[paragraph('Os critérios ficam associados à sua empresa e ao seu acesso.'),label],[button('Salvar busca',()=>{dialog.close();announce('Busca salva apenas nesta demonstração.');},true)]);return;}
    if(action==='saved-searches'){showDialog('Buscas salvas',[block('Operações · Pessoas ativas','Exemplo de busca com critérios reutilizáveis nesta empresa.')],[button('Aplicar busca',()=>{dialog.close();state.step='1';render();},true)]);return;}
    if(action==='columns'){showDialog('Colunas da sua base',[paragraph('A visualização prioriza identificação, atuação recente, cidade e data do Perfil. No celular, os mesmos registros passam a blocos por Pessoa.')]);return;}
    if(action==='sources'){const name=el.closest('td')?.dataset.label||'Marina Costa',p=peopleData[name];showDialog('Fonte da informação · '+name,[block('Experiência publicada',p.company+' · '+p.role+'.'),block('Trecho ilustrativo',el.closest('td')?.querySelector('p')?.textContent||'Coordenação da rotina operacional, liderança da equipe e acompanhamento de indicadores.'),block('Origem preservada',p.file+' · Perfil publicado. Conteúdo fictício da proposta; a informação é uma declaração documentada, não uma verificação de desempenho.')]);return;}
    if(action==='score'){showDialog('Entender a compatibilidade observada',[paragraph('O Score é contextual à Posição de Coordenação de Operações. A nota provisória deve ser lida junto às evidências e pendências.'),block('Trajetória e requisitos','A relação profissional e a evidência de cada requisito são dimensões distintas. Consulte as fontes e a cobertura antes de decidir.'),block('Limite de interpretação','Uma informação ausente não comprova incapacidade. O resultado não aprova, elimina nem escolhe uma pessoa.')]);return;}
    if(action==='manager-summary'){showDialog('Resumo para o gestor',[paragraph('Coordenação de Operações · Processo 01 · Empresa Horizonte'),block('Pessoas comparadas',state.people.join(' e ')+'. Consulte a matriz por requisito e as fontes de cada Perfil.'),block('Pontos para aprofundar','Confirmar a escala das equipes, os resultados dos projetos e a participação no planejamento orçamentário.'),block('Registro humano','O resumo reúne evidências para discussão. Não há pessoa escolhida automaticamente.')],[button('Preparar resumo',()=>{dialog.close();announce('Resumo ilustrativo preparado para revisão humana. Nenhum dado foi enviado ou compartilhado.');},true)]);return;}
    if(action==='review-import'){const label=document.createElement('label');label.textContent='Cargo identificado';const input=document.createElement('input');input.value='Gerente de Operações';label.append(input);showDialog('Revisar currículo · Marina Costa',[block('Fonte ao lado do campo','curriculo_marina.pdf · Experiência na Empresa Aurora. No fluxo completo, a fonte permanece consultável durante a revisão.'),label,block('Publicação preservada','Conferir as alterações é uma etapa anterior à publicação. Uma falha neste arquivo não altera os demais.')],[button('Salvar rascunho',()=>{dialog.close();announce('Rascunho salvo na demonstração. Nenhum Perfil foi publicado.');}),button('Conferir alterações',()=>showDialog('Conferir antes de publicar',[block('Perfil vigente','Versão 3 permanece publicada até a confirmação humana.'),block('Alteração em revisão','Cargo identificado e conteúdo profissional serão comparados com a versão vigente.')],[button('Confirmar publicação',()=>{dialog.close();announce('Confirmação ilustrada. Não houve alteração de dados reais.');},true)]),true)]);return;}
    if(action==='update-profile'||action==='person-more'){showDialog('Atualizar o Perfil',[paragraph('Escolha a origem da atualização. A nova versão passará pela revisão e conferência das alterações.')],[button('Preencher manualmente',()=>announce('Atualização manual ilustrada: preserva origem, rascunho e revisão.')),button('Importar currículo',()=>{dialog.close();state.step='6';render();},true)]);return;}
    if(action==='identity'){showDialog('Conferir identificação',[paragraph('Há um possível cadastro correspondente. A escolha da Pessoa exige confirmação humana; nenhum cadastro é mesclado automaticamente.')],[button('Consultar cadastro existente',()=>{dialog.close();state.step='3';render();})]);return;}
    if(action==='add-files'||action==='replace-file'){showDialog(action==='add-files'?'Adicionar currículos':'Substituir arquivo protegido',[paragraph('Proposta de seleção de múltiplos PDFs, com resultado e recuperação separados por arquivo. Esta demonstração não recebe nem envia documentos.')],[button('Usar arquivos de exemplo',()=>{dialog.close();announce('Fila de exemplo mantida. Cada arquivo tem seu próprio estado de processamento e revisão.');},true)]);return;}
    if(action==='connection'){showDialog('Conexão de dados proposta',[block('1 · Definir a origem','Escolher o sistema atual e a forma de exportação autorizada.'),block('2 · Conferir os campos','Mapear identificação e conteúdo profissional, preservando origem e empresa.'),block('3 · Revisar a entrada','Resolver duplicidades e revisar antes da publicação. Nenhuma integração com fornecedor está aprovada nesta proposta.')]);return;}
    if(action==='token-sources'||action==='movements'){showDialog(action==='movements'?'Movimentações da empresa':'Origens do saldo',[block('Franquia de outubro','Saldo ilustrativo: 865.000 de 1.000.000 de Tokens Prisma. Renovação em 01/11/2026.'),block('Consumo registrado','Leitura de currículos: 90.000. Questões de avaliação: 40.000. Síntese de Perfis: 5.000. Valores fictícios para demonstrar a composição.')]);return;}
    if(action==='packages'){showDialog('Pacotes e planejamento',[paragraph('A consulta de pacotes conserva o fluxo comercial atual. Uma simulação de atividade não gera pedido, cobrança ou reserva.')]);return;}
    if(action==='menu'){showDialog('Navegação da empresa',[paragraph('Empresa Horizonte · Clara Mendes · '+state.homeRole)],[button('Início',()=>{dialog.close();state.step='2';render();}),button('Pessoas',()=>{dialog.close();state.step='1';render();}),button('Tokens Prisma',()=>{dialog.close();state.step='5';render();})]);return;}
    if(action==='marina-profile'){state.step='3';render();return;}
    if(action==='rafael-profile'||action==='joana-profile'){showDialog(action==='rafael-profile'?'Rafael Lima':'Joana Alves',[paragraph('Este registro representa outro Perfil autorizado da mesma empresa. A apresentação segue a proposta de Perfil, com informações próprias.')]);return;}
    if(action==='role-context'){showDialog('Contexto do perfil de acesso',[paragraph('A proposta do Início adapta prioridades ao papel atual. Ela não concede acesso a empresas, saldos ou dados fora do escopo autorizado.')]);return;}
    if(action==='new-person'){showDialog('Preencher Perfil manualmente',[paragraph('O fluxo manual existente continua disponível, com rascunho, origem identificada e publicação humana após a revisão.')]);return;}
    if(action==='open-process'||action==='interviews'||action==='approved-profiles'){showDialog(action==='interviews'?'Entrevistas registradas':action==='approved-profiles'?'Perfis publicados':'Acompanhamento · Processo 01',[paragraph('O atalho abre o contexto correspondente com os filtros adequados. Na implementação, ele reutilizará as telas atuais de Pessoas e Processos seletivos.')]);}
  });
  render();
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=>{render();}});tweak.addSelect(state,'homeRole',{label:'Início por perfil',options:['Recruiter','Owner','Super Admin','Usuário comum']});}
})();
</script>
